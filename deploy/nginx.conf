# Excel Combiner: serves the frontend and forwards /api to the backend on the same server.
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/excel-combiner
#          sudo ln -s /etc/nginx/sites-available/excel-combiner /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
server {
    # Open as http://SERVER_IP/. If port 80 is already used by another site, change to e.g. 8080.
    listen 80 default_server;
    server_name _;

    # Frontend build (npm run build in the frontend repo).
    root /opt/excel-combiner/frontend/dist;
    index index.html;

    # Total size of one upload (all files together).
    client_max_body_size 1g;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;

        # Combining big uploads can take a while.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Stream uploads and results straight through instead of buffering them in temp files on disk.
        proxy_request_buffering off;
        proxy_buffering off;
    }

    location / {
        try_files $uri /index.html;
    }
}
